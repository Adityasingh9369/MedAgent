name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/clinicalagent"
      REDIS_URL: "redis://localhost:6379"
      OPENROUTER_API_KEY: "dummy-key-for-ci"
      NCBI_API_KEY: "dummy-key-for-ci"
      GEMINI_API_KEY: "dummy-key-for-ci"
      LANGSMITH_API_KEY: "dummy-key-for-ci"
      LANGCHAIN_TRACING_V2: "false"
      LANGCHAIN_PROJECT: "clinicalagent-ci"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install spaCy model
        run: |
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl

      - name: Import check — verify all modules load without error
        run: |
          python -c "import src.config"
          python -c "import src.database.models"
          python -c "import src.database.connection"
          python -c "import src.agents.pipeline"
          python -c "import src.evaluation.ragas_evaluator"
          python -c "import src.ml.risk_tool"
          python -c "import src.api.main"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t clinicalagent-api:ci .